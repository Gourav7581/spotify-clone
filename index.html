<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="Utility.css">
    <title>PB Spotify - for Enjoyment</title>
</head>

<body>
    <!-- <img src="logo.svg" alt="spotify">   -->
    <div class="container flex bg-black">
        <div class="left ">

            <!-- left top with logo ,home,search  -->
            <div class="home bg-gray rounded m1 p1">
                <!-- close svg -->
                <div class="close">
                    <img width="20px" height="20px" src="img/close.svg" alt="">
                </div>
                <!-- logo -->
                <div class="logo"><img class="invert" src="img/logo.svg" alt="logo">
                    <h2>PB Spotify</h2>

                </div>
                <!-- home, Search -->
                <ul>
                    <li><img class="invert" src="img/home.svg" alt="home">Home</li>
                    <li><img class="invert" src="img/Search.svg" alt="home">Search</li>
                </ul>
            </div>
            <!-- Left second library box -->
            <div class="library bg-gray rounded m1 p1">
                <!-- heading section -->
                <div class="heading">
                    <img src="img/playlist_white.svg" alt="">
                    <h2>Your Library</h2>

                </div>

                <!-- songList -->
                <div class="songlist">
                    <ul>

                    </ul>
                </div>


                <!-- Footer part of box -->
                <div class="footer">
                    <div><a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a></div>
                    <div><a href="https://www.spotify.com/jp/privacy/"><span>Privacy Center</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/"><span>Privacy Policy</span></a>
                    </div>
                    <div><a href="https://www.spotify.com/jp/legal/cookies-policy/"><span>Cookies</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"><span>About Ads</span></a></div>
                    <div><a href="https://www.spotify.com/jp/accessibility/"><span>Accessibility</span></a></div>
                </div>
            </div>

        </div>



        <!-- ======================================================================================================================== -->

        <div class="Right bg-gray rounded ">
            <!-- header section of playlist -->
            <div class="header">
                <!-- navigation button left right -->
                <div class="nav">
                    <div class="hamburgercontainer">
                        <img src="img/hamburger.svg" class="hamburder" alt="">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M15 6L9.70711 11.2929C9.37377 11.6262 9.20711 11.7929 9.20711 12C9.20711 12.2071 9.37377 12.3738 9.70711 12.7071L15 18"
                                stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M9 18L14.2929 12.7071C14.6262 12.3738 14.7929 12.2071 14.7929 12C14.7929 11.7929 14.6262 11.6262 14.2929 11.2929L9 6"
                                stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                </div>
                <!-- login sign in button -->
                <div class="button">
                    <button class="signupbtn" type="button">Sign up</button>
                    <button class="loginbtn" type="button">Log in</button>
                </div>
            </div>

            <!-- playlist section -->
            <div class="spotifyplaylists">
                <h2>Spotify Playlists</h2>
                <div class="cardcontainer">
                  
                </div>
                <!-- =================================== play bar card ke niche vala  -->
                <div class="playbar">
                    <div class="seekbar">
                        <div class="circle">

                        </div>
                    </div>
                    <div class="abovebar">
                        <div class="songinfo"></div>
                        <div class="songbuttons">
                            <img id="previous" src="img/prevsong.svg" alt="" class="playimg">
                            <img id="play" src="img/play.svg" alt="" class="playimg">
                            <img id="next" src="img/nextsong.svg" alt="" class="playimg">
                        </div>
                        <!-- songtime and volumn -->
                        <div class="timevol">
                            <div class="songtime"></div>
                            <div class="volume">
                                <img src="img/volume.svg" width="24px" height="24px" alt="">
                                <div class="range">
                                    <input type="range" min="0" max="100" value="50">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <script src="Script.js"></script>
</body>

</html>
